<style>
        .blueprint-grid {
            background-image: linear-gradient(to right, rgba(140, 145, 151, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(140, 145, 151, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- Left Visual Panel (Suppressed on Mobile) -->
<div class="hidden lg:flex lg:w-3/5 relative bg-surface-container-lowest overflow-hidden items-center justify-center border-r border-outline-variant/20">
<!-- Blueprint Grid Overlay -->
<div class="absolute inset-0 blueprint-grid pointer-events-none z-10"></div>
<!-- High-Tech Contextual Image -->
<div class="absolute inset-0 opacity-40 mix-blend-luminosity z-0" data-alt="A highly detailed, photorealistic render of an advanced, minimalist medical-automotive dashboard interface glowing in a dark room. Deep blacks, clinical whites, and subtle accents of burnt copper (#C45923). The mood is precise, authoritative, and strictly high-tech engineering. The lighting is low-key, illuminating intricate technical telemetry graphics and precise 1px connecting lines." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBeIqABMKdRSwVfTOWfWF4OgNjshzObak0_ksSJoMl533aPRpk_KDtjMIFKHaZYQeJjfdj1X_2loDUoPIqv2hGJWTx8nOgX3KKFTahIXmas1QsezY2hvPHRKRGRk5zJQV0WFuzPVHGcThG-N2TuNQR6uDC0fXgKe8i49vtgDrk1XzUwZMUqAXLT7NRxlUW2eXv0vCzG-88x0kT0bXMnvQCdOJKbOH3cr1jKb5tVnQEgUkDXo8ShtnPo4s3PSWkughkfXAs'); background-size: cover; background-position: center;">
</div>
<!-- Technical Overlays -->
<div class="absolute inset-0 z-20 flex flex-col justify-between p-margin-desktop pointer-events-none">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-technical text-technical text-primary uppercase tracking-widest">Secure Environment Active</span>
</div>
<div class="max-w-md">
<div class="h-px w-16 bg-primary mb-md"></div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-md">Smart Ride OS<br/><span class="text-on-surface-variant">v4.2.1 Core</span></h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Authorized personnel only. All access attempts are logged and monitored by the Kinetic Logic framework.</p>
</div>
</div>
</div>
<!-- Right Login Form Panel -->
<div class="w-full lg:w-2/5 flex flex-col justify-center px-lg py-5xl sm:px-margin-desktop bg-surface relative z-30">
<!-- Mobile Header (Visible only on small screens) -->
<div class="lg:hidden mb-4xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Smart Ride OS</h1>
<p class="font-technical text-technical text-primary uppercase tracking-widest flex items-center gap-sm">
<span class="material-symbols-outlined" style="font-size: 16px;">lock</span> Secure Portal
            </p>
</div>
<div class="w-full max-w-md mx-auto flex flex-col gap-2xl">
<div class="flex flex-col gap-sm">
<h2 class="font-headline-lg text-headline-lg text-on-surface hidden lg:block">System Access</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant hidden lg:block">Sign in to your account.</p>
</div>
<form class="flex flex-col gap-xl">
<!-- Operator ID Input Group -->
<div class="flex flex-col gap-sm group">
<label class="font-technical text-technical text-on-surface-variant uppercase tracking-widest group-focus-within:text-primary transition-colors" for="operatorId">Email</label>
<div class="relative">
<input autocomplete="username" class="w-full bg-transparent border-b border-outline-variant py-md font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/30 focus:border-primary focus:ring-0 outline-none transition-colors" id="operatorId" name="operatorId" placeholder="e.g. OP-7492-X" required="" type="text"/>
</div>
</div>
<!-- Access Key Input Group -->
<div class="flex flex-col gap-sm group">
<div class="flex justify-between items-center w-full">
<label class="font-technical text-technical text-on-surface-variant uppercase tracking-widest group-focus-within:text-primary transition-colors" for="accessKey">Password</label>
<a class="font-technical text-technical text-primary hover:text-primary-container transition-colors" href="#">Forgot Key?</a>
</div>
<div class="relative">
<input autocomplete="current-password" class="w-full bg-transparent border-b border-outline-variant py-md font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/30 focus:border-primary focus:ring-0 outline-none transition-colors" id="accessKey" name="accessKey" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="mt-lg w-full bg-primary-container text-on-primary-container font-technical text-technical uppercase tracking-widest py-xl rounded flex items-center justify-center gap-md hover:bg-primary-container/90 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background group" type="submit">Get Started <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span></button>
</form>
<!-- Security Badge -->
</div>
</div>
</body></html>
